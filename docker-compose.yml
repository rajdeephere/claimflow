# ClaimFlow local environment.
#   docker compose up -d                          -> infrastructure only: Postgres, Kafka, Kafka UI
#                                                    (run the services from your IDE / java -jar)
#   docker compose --profile apps up -d --build   -> infrastructure + all 5 services in containers
#                                                    (API at http://localhost:8000)
services:
  postgres:
    image: postgres:16-alpine
    container_name: claimflow-postgres
    environment:
      POSTGRES_USER: claimflow
      POSTGRES_PASSWORD: claimflow
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"   # 5433 on the host: a local PostgreSQL already uses 5432
    volumes:
      # Creates policy_db, claim_db, payment_db on first start (database-per-service)
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: claimflow-kafka
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft cluster: this node is both broker and controller (no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # HOST listener for apps on your machine, INTERNAL for containers on the compose network
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are declared explicitly by the services
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: claimflow-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: claimflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------- application services (profile: apps)
  # Inside the compose network services use container names and internal ports (postgres:5432,
  # kafka:29092), not the host ports. Only the gateway is published: the one public entry point.

  policy-service:
    profiles: ["apps"]
    build: { context: ., args: { MODULE: policy-service } }
    image: claimflow/policy-service:dev
    environment:
      PORT: "8081"               # also used by the healthcheck
      DB_URL: jdbc:postgresql://postgres:5432/policy_db
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck: &health
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT}/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  claim-service:
    profiles: ["apps"]
    build: { context: ., args: { MODULE: claim-service } }
    image: claimflow/claim-service:dev
    environment:
      PORT: "8082"               # also used by the healthcheck
      DB_URL: jdbc:postgresql://postgres:5432/claim_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck: *health

  validation-service:
    profiles: ["apps"]
    build: { context: ., args: { MODULE: validation-service } }
    image: claimflow/validation-service:dev
    environment:
      PORT: "8083"               # also used by the healthcheck
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POLICY_SERVICE_URL: http://policy-service:8081
    depends_on:
      kafka: { condition: service_healthy }
      policy-service: { condition: service_healthy }
    healthcheck: *health

  payment-service:
    profiles: ["apps"]
    build: { context: ., args: { MODULE: payment-service } }
    image: claimflow/payment-service:dev
    environment:
      PORT: "8084"               # also used by the healthcheck
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck: *health

  api-gateway:
    profiles: ["apps"]
    build: { context: ., args: { MODULE: api-gateway } }
    image: claimflow/api-gateway:dev
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"               # also used by the healthcheck
      POLICY_SERVICE_URL: http://policy-service:8081
      CLAIM_SERVICE_URL: http://claim-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8084
    depends_on:
      policy-service: { condition: service_healthy }
      claim-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
    healthcheck: *health

volumes:
  postgres-data:
