server:
  port: ${PORT:8081}

spring:
  application:
    name: policy-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/policy_db}
    username: ${DB_USER:claimflow}
    password: ${DB_PASSWORD:claimflow}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks entities match it
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true

claimflow:
  api:
    title: "ClaimFlow Policy API"
    description: "Customers, policies and coverages (PolicyCenter-like), including the coverage check used by claim validation."
    version: 1.0.0                       # contract version of /api/v1 (ADR-0030)
    server-url: ${API_SERVER_URL:http://localhost:8000}

springdoc:
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    # %X{correlationId} prints the MDC value set by CorrelationIdFilter
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
