server:
  port: ${PORT:8082}

spring:
  application:
    name: claim-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/claim_db}
    username: ${DB_USER:claimflow}
    password: ${DB_PASSWORD:claimflow}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks entities match it
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all                       # wait for all in-sync replicas
      properties:
        enable.idempotence: true      # broker drops duplicates caused by producer retries
        max.block.ms: 5000            # don't block the relay for 60 s if the broker is down
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: claim-service
      auto-offset-reset: earliest     # a new consumer group starts from the beginning, not "now"
      enable-auto-commit: false       # Spring commits after the listener succeeds
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record                # commit each offset right after its record is processed

claimflow:
  api:
    title: "ClaimFlow Claim API"
    description: "First Notice of Loss, the claim lifecycle, adjusters and the audit trail (ClaimCenter-like). Supports Idempotency-Key on FNOL and ETag/If-Match on changes."
    version: 1.0.0                       # contract version of /api/v1 (ADR-0030)
    server-url: ${API_SERVER_URL:http://localhost:8000}
  outbox:
    poll-interval-ms: 500
    batch-size: 100
  kafka:
    retry:
      initial-interval-ms: 500
      max-retries: 3

springdoc:
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    # %X{correlationId} prints the MDC value set by CorrelationIdFilter
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
