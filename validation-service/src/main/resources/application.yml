server:
  port: ${PORT:8083}

spring:
  application:
    name: validation-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: validation-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record

claimflow:
  policy-service:
    # Service-to-service call goes straight to Policy Service, not through the public gateway.
    base-url: ${POLICY_SERVICE_URL:http://localhost:8081}
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
  validation:
    late-notification-days: 30
  kafka:
    retry:
      initial-interval-ms: 500
      max-retries: 3
      # Policy Service unavailable: keep retrying (blocking the partition) instead of dead-lettering.
      dependency-max-elapsed-ms: 600000

# No public API (it only consumes Kafka events), so no OpenAPI / Swagger UI.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    # %X{correlationId} prints the MDC value set by CorrelationIdFilter
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
